# =========================================================
# Serenity BDD Configuration
# =========================================================

webdriver {
  driver = chrome
  autodownload = true
  timeouts.implicitlywait = 5000
}

headless.mode = true

chrome {
  switches = """
    --start-maximized;
    --disable-infobars;
    --disable-gpu;
    --disable-extensions;
    --no-sandbox;
    --disable-dev-shm-usage;
    --remote-allow-origins=*
  """
}

serenity {
  take.screenshots = FOR_FAILURES
  restart.browser.each.scenario = true
  console.colors = true
  project.name = "SauceDemo - Serenity Cucumber BDD Automation Framework"
  test.root = "features"
  reports.show.step.details = true
}

# Default application URL - can be overridden via -Dwebdriver.base.url=
webdriver.base.url = "https://www.saucedemo.com/"

# Test data (referenced from step definitions / config if needed)
test {
  data {
    username = "standard_user"
    password = "secret_sauce"
  }
}

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
  dev {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
  qa {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
}
